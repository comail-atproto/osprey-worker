name: Approve and merge dependency updates

on:
  workflow_run:
    workflows: [Build and publish worker]
    types: [completed]

permissions:
  contents: read

jobs:
  approve-and-merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Approve and enable auto-merge for a verified Dependabot update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/auto-merge-dependabot.sh "${{ github.event.workflow_run.head_sha }}"
