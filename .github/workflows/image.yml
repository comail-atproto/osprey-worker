name: Build and publish worker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/comail-atproto/osprey-worker:build-${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          files: .github/workflows/*.yml
      - run: shellcheck scripts/*.sh
      - run: bash scripts/test-publish.sh
      - run: bash scripts/test-auto-merge-dependabot.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 45 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Select exact build sources
        run: |
          echo "BUILD_REVISION=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_REVISION=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: worker
          load: true
          set: |
            *.cache-from=type=gha,scope=osprey-worker
            *.cache-to=type=gha,scope=osprey-worker,mode=max
      - name: Check offline worker startup and image identity
        run: bash scripts/smoke-test.sh "$IMAGE"
      - name: Export the tested image for independent restore
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ runner.temp }}
        run: |
          docker save --output worker.tar "$IMAGE"
          sha256sum worker.tar > worker.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: worker-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/worker.tar
            ${{ runner.temp }}/worker.tar.sha256
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  publish:
    needs: [validate, build-and-test]
    if: >-
      github.repository == 'comail-atproto/osprey-worker' &&
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.ENABLE_OSPREY_GHCR_PUBLISHER == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-image-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Restore the exact tested image
        working-directory: ${{ runner.temp }}
        run: |
          sha256sum --check worker.tar.sha256
          docker load --input worker.tar
      - name: Recheck offline startup after independent restore
        run: bash scripts/smoke-test.sh "$IMAGE"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the restored image and retain provenance
        id: publish
        run: bash scripts/publish.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/comail-atproto/osprey-worker
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-provenance-${{ github.sha }}
          path: ${{ runner.temp }}/provenance.json
          retention-days: 90
          if-no-files-found: error
