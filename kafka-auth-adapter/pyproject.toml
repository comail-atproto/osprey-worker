[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comail-osprey-kafka-auth"
version = "0.1.0"
description = "Kafka authentication adapter for the Comail Osprey worker image"
requires-python = ">=3.11"
dependencies = [
    "kafka-python==1.4.7",
    "osprey-worker==0.1.0",
    "pluggy==1.5.0",
]

[project.entry-points."osprey_plugin"]
comail_kafka_auth = "comail_osprey_kafka_auth.plugin"

[tool.setuptools.packages.find]
where = ["src"]
